# Use PORT from environment (Render/Cloud), default 8080
server.port=${PORT:8080}

# Database URL from environment (DATABASE_URL, SPRING_DATASOURCE_URL, or DB_URL)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/workhub_db}}}

# Credentials (optional if embedded in Database URL)
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Optional explicit driver (auto-detected if not set)
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Run schema SQL automatically at startup (supports backend and repo-root working dirs)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,optional:file:../database/schema.sql,optional:file:database/schema.sql

# HikariCP - tune for low connection limits (e.g., AlwaysData free)
spring.datasource.hikari.pool-name=WorkHubHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:1}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
# 30 seconds
spring.datasource.hikari.idle-timeout=30000
# 60 seconds
spring.datasource.hikari.max-lifetime=60000
# 20 seconds
spring.datasource.hikari.connection-timeout=20000
# disabled
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=0

# JTA warning: Safe to ignore (no JTA platform configured)

# Google Sign-In (ID token) audience check
workhub.google.client-id=${WORKHUB_GOOGLE_CLIENT_ID:}
workhub.google.client-secret=${WORKHUB_GOOGLE_CLIENT_SECRET:}
workhub.google.redirect-uri=${WORKHUB_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
workhub.google.frontend-url=${WORKHUB_FRONTEND_URL:http://localhost:5173}
